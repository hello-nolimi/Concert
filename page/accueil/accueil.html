<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
    <title>Accueil</title>
    <link rel="stylesheet" href="../../styles/theme.css" />
    <link rel="stylesheet" href="../../styles/mobile.css" />
    <link rel="stylesheet" href="../../componant/navbar/navbar.css" />
    <link rel="stylesheet" href="../../componant/post-concert/post-concert.css" />
    <link rel="stylesheet" href="../../componant/post-artiste/post-artiste.css" />
    <style>
      .accueil {
        padding-top: 0;
        padding-bottom: 40px;
      }

      .accueil__hero {
        position: relative;
        width: 100%;
        height: calc(100dvh - 170px);
        margin: 76px 0 0;
        border-radius: 24px;
        overflow: hidden;
        background: #161616;
      }

      .accueil__slides {
        position: absolute;
        inset: 0;
      }

      .accueil__slide {
        position: absolute;
        inset: 0;
        z-index: 0;
        pointer-events: none;
        transform: translate3d(100%, 0, 0);
        will-change: transform;
      }

      .accueil__slide.is-active {
        z-index: 1;
        pointer-events: auto;
        transform: translate3d(0, 0, 0);
      }

      @media (prefers-reduced-motion: reduce) {
        .accueil__slide {
          transition: none !important;
        }
      }

      .accueil__slide img,
      .accueil__slide video {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: center;
        pointer-events: none;
      }

      .accueil__slide-content {
        position: absolute;
        left: 28px;
        bottom: 28px;
        z-index: 2;
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 8px;
        max-width: 460px;
      }

      .accueil__slide-artist {
        margin: 0;
        font-size: 28px;
        font-weight: 800;
        letter-spacing: -0.03em;
        line-height: 1;
        color: #fff;
      }

      .accueil__slide-text {
        margin: 0 0 6px;
        font-size: 16px;
        color: rgba(255, 255, 255, 0.85);
      }

      .accueil__slide-actions {
        display: flex;
        gap: 10px;
      }

      .accueil__slide-ticket {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        height: 44px;
        padding: 0 16px;
        border: none;
        border-radius: 999px;
        font: inherit;
        font-size: 14px;
        font-weight: 700;
        cursor: pointer;
        white-space: nowrap;
      }

      .accueil__slide-ticket {
        color: #0a0a0a;
        background: #fff;
      }

      .accueil__hero-zone {
        position: absolute;
        top: 0;
        bottom: 0;
        z-index: 3;
        display: flex;
        align-items: center;
        width: 140px;
      }

      .accueil__hero-zone--prev {
        left: 0;
        justify-content: flex-start;
        padding-left: 28px;
      }

      .accueil__hero-zone--next {
        right: 0;
        justify-content: flex-end;
        padding-right: 28px;
      }

      .accueil__hero-arrow {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 46px;
        height: 46px;
        border: none;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.28);
        color: #fff;
        border: 1px solid rgba(255, 255, 255, 0.4);
        backdrop-filter: blur(8px);
        cursor: pointer;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.2s ease;
      }

      .accueil__hero-zone:hover .accueil__hero-arrow {
        opacity: 1;
        pointer-events: auto;
      }

      .accueil__hero-arrow svg {
        width: 20px;
        height: 20px;
      }

      .accueil__hero-dots {
        position: absolute;
        right: 28px;
        bottom: 42px;
        z-index: 3;
        display: flex;
        gap: 8px;
      }

      .accueil__hero-dot {
        width: 28px;
        height: 3px;
        padding: 0;
        border: none;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.35);
        cursor: pointer;
      }

      .accueil__hero-dot.is-active {
        background: #fff;
      }

      .accueil__rubriques {
        display: flex;
        flex-direction: column;
        gap: 48px;
        margin-top: 48px;
      }

      @media (min-width: 900px) {
        .accueil__hero {
          width: 100%;
          height: calc(100dvh - 180px);
          margin: 72px 0 0;
          border-radius: 28px;
        }

        .accueil__slide-content {
          left: 36px;
          bottom: 36px;
        }

        .accueil__slide-artist {
          font-size: 36px;
        }

        .accueil__hero-dots {
          right: 36px;
          bottom: 52px;
        }
      }

      @media (max-width: 899px) {
        .accueil__hero-zone {
          display: none;
        }
      }

      .accueil__rubrique {
        display: flex;
        flex-direction: column;
        gap: 22px;
      }

      .accueil__rubrique-title {
        margin: 0;
        font-size: 22px;
        font-weight: 400;
        letter-spacing: -0.02em;
        text-align: left;
      }

      .accueil__rubrique-title--live {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .accueil__rubrique-title--live::before {
        content: "";
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: #e53935;
        flex-shrink: 0;
      }

      .accueil__prochain-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
      }

      .accueil__week {
        position: relative;
        flex-shrink: 0;
      }

      .accueil__week-btn {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        height: 32px;
        padding: 0;
        border: none;
        background: transparent;
        color: rgba(255, 255, 255, 0.78);
        font: inherit;
        font-size: 14px;
        cursor: pointer;
      }

      .accueil__week-btn svg {
        width: 16px;
        height: 16px;
      }

      .accueil__week-panel {
        position: absolute;
        top: calc(100% + 8px);
        right: 0;
        z-index: 6;
        width: 190px;
        max-height: 280px;
        overflow: auto;
        padding: 10px;
        border-radius: 14px;
        background: #1c1c1c;
        box-shadow: 0 12px 30px rgba(0, 0, 0, 0.45);
      }

      .accueil__week-panel[hidden] {
        display: none;
      }

      .accueil__week-year {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 6px;
        font-size: 14px;
        font-weight: 700;
      }

      .accueil__week-year button {
        width: 28px;
        height: 28px;
        border: none;
        border-radius: 8px;
        background: transparent;
        color: #fff;
        font: inherit;
        font-size: 18px;
        cursor: pointer;
      }

      .accueil__week-list {
        display: flex;
        flex-direction: column;
        gap: 2px;
      }

      .accueil__week-option {
        width: 100%;
        padding: 8px 10px;
        border: none;
        border-radius: 8px;
        background: transparent;
        color: rgba(255, 255, 255, 0.82);
        font: inherit;
        font-size: 14px;
        text-align: left;
        cursor: pointer;
      }

      .accueil__week-option.is-active,
      .accueil__week-option:hover {
        background: rgba(255, 255, 255, 0.1);
        color: #fff;
      }

      .accueil__schedule {
        display: flex;
        flex-direction: column;
      }

      .accueil__slot {
        --slot-line: 78px;
        position: relative;
        display: grid;
        grid-template-columns: 64px 48px 40px minmax(0, 1fr) auto;
        align-items: center;
        gap: 14px;
        padding: 16px 0;
        border-bottom: 1px solid rgba(255, 255, 255, 0.12);
      }

      .accueil__slot--continued {
        border-bottom-color: transparent;
      }

      .accueil__slot--continued::after {
        content: "";
        position: absolute;
        left: var(--slot-line);
        right: 0;
        bottom: 0;
        height: 1px;
        background: rgba(255, 255, 255, 0.12);
      }

      .accueil__slot-date {
        display: flex;
        flex-direction: column;
        gap: 2px;
        min-height: 42px;
      }

      .accueil__slot-date strong {
        font-size: 28px;
        font-weight: 500;
        letter-spacing: -0.03em;
        line-height: 1;
      }

      .accueil__slot-date span,
      .accueil__slot-time,
      .accueil__slot-info span {
        font-size: 12px;
        color: rgba(255, 255, 255, 0.55);
      }

      .accueil__slot-time {
        font-size: 14px;
      }

      .accueil__slot-thumb {
        display: block;
        width: 40px;
        height: 40px;
        border-radius: 8px;
        object-fit: cover;
        background: #2a2a2a;
      }

      .accueil__slot-info {
        min-width: 0;
        display: flex;
        flex-direction: column;
        gap: 2px;
      }

      .accueil__slot-info strong {
        font-size: 15px;
        font-weight: 700;
      }

      .accueil__slot-btn {
        height: 32px;
        padding: 0 14px;
        border: none;
        border-radius: 999px;
        background: #3a3a3a;
        color: rgba(255, 255, 255, 0.88);
        font: inherit;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
        white-space: nowrap;
      }

      .accueil__schedule-empty {
        margin: 0;
        padding: 8px 0 4px;
        font-size: 14px;
        color: rgba(255, 255, 255, 0.55);
      }

      @media (max-width: 899px) {
        .accueil__slot {
          --slot-line: 62px;
          grid-template-columns: 52px 42px 36px minmax(0, 1fr) auto;
          gap: 10px;
        }

        .accueil__slot-date strong {
          font-size: 24px;
        }
      }

      .accueil__rail {
        display: flex;
        gap: 28px;
        width: calc(100% + 50px);
        margin-right: -50px;
        overflow-x: auto;
        overscroll-behavior-x: contain;
        touch-action: pan-x pan-y;
        padding-bottom: 4px;
        scrollbar-width: none;
      }

      .accueil__rail::-webkit-scrollbar {
        display: none;
      }

      .accueil__rail .post-concert {
        flex: 0 0 210px;
        width: 210px;
      }

      @media (max-width: 899px) {
        .accueil__rail {
          width: calc(100% + 32px);
          margin-left: -16px;
          margin-right: -16px;
          padding-left: 16px;
        }
      }

      @media (min-width: 900px) {
        .accueil__rail {
          width: calc(100% + 100px);
          margin-left: -50px;
          padding-left: 50px;
        }
      }

      .accueil__artistes .post-artiste {
        width: 96px;
      }

      .accueil__artistes .post-artiste__avatar {
        width: 88px;
        height: 88px;
      }

      .accueil__artistes .post-artiste__name {
        font-size: 13px;
      }
    </style>
  </head>
  <body>
    <div class="app-shell" id="app">
      <main class="accueil" id="accueil">
        <div class="accueil__hero" id="hero">
          <div class="accueil__slides" id="hero-slides"></div>
          <div class="accueil__hero-zone accueil__hero-zone--prev">
            <button type="button" class="accueil__hero-arrow" id="hero-prev" aria-label="Page précédente">
              <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="m15 5-7 7 7 7" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
              </svg>
            </button>
          </div>
          <div class="accueil__hero-zone accueil__hero-zone--next">
            <button type="button" class="accueil__hero-arrow" id="hero-next" aria-label="Page suivante">
              <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="m9 5 7 7-7 7" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
              </svg>
            </button>
          </div>
          <div class="accueil__hero-dots" id="hero-dots"></div>
        </div>

        <div class="accueil__rubriques">
          <section class="accueil__rubrique" aria-labelledby="title-live">
            <h2 class="accueil__rubrique-title accueil__rubrique-title--live" id="title-live">En directe</h2>
            <div class="accueil__rail" id="rail-live"></div>
          </section>

          <section class="accueil__rubrique" aria-labelledby="title-attendus">
            <h2 class="accueil__rubrique-title" id="title-attendus">A ne pas rater</h2>
            <div class="accueil__rail" id="rail-attendus"></div>
          </section>

          <section class="accueil__rubrique" aria-labelledby="title-prochainement">
            <div class="accueil__prochain-head">
              <h2 class="accueil__rubrique-title" id="title-prochainement">Prochainement</h2>
              <div class="accueil__week">
                <button type="button" class="accueil__week-btn" id="week-btn" aria-expanded="false" aria-haspopup="listbox">
                  <span id="week-label">Semaine</span>
                  <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="m6 9 6 6 6-6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
                </button>
                <div class="accueil__week-panel" id="week-panel" hidden>
                  <div class="accueil__week-year">
                    <button type="button" id="year-prev" aria-label="Année précédente">‹</button>
                    <span id="year-label"></span>
                    <button type="button" id="year-next" aria-label="Année suivante">›</button>
                  </div>
                  <div class="accueil__week-list" id="week-list" role="listbox" aria-label="Semaines"></div>
                </div>
              </div>
            </div>
            <div class="accueil__schedule" id="schedule"></div>
          </section>

          <section class="accueil__rubrique" aria-labelledby="title-artistes">
            <h2 class="accueil__rubrique-title" id="title-artistes">Artistes à ne pas louper</h2>
            <div class="accueil__rail accueil__artistes" id="rail-artistes"></div>
          </section>

          <section class="accueil__rubrique" aria-labelledby="title-replay">
            <h2 class="accueil__rubrique-title" id="title-replay">Replay</h2>
            <div class="accueil__rail" id="rail-replay"></div>
          </section>
        </div>
      </main>
    </div>

    <script type="module">
      import { mountNavbar } from '../../componant/navbar/navbar.js'
      import { renderHero, renderHome } from './accueil.js'
      import { posts } from '../../data/posts.js'

      mountNavbar('#app', { brand: 'My Concert', active: 'accueil' })
      renderHero()
      renderHome(posts)
    </script>
  </body>
</html>
