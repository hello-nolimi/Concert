<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
    <title>Live</title>
    <link rel="stylesheet" href="../../styles/theme.css" />
    <link rel="stylesheet" href="../../styles/mobile.css" />
    <link rel="stylesheet" href="./live.css" />
  </head>
  <body>
    <div class="app-shell" id="app">
      <main class="live-page">
        <div class="live-page__top">
          <button type="button" class="live-page__back" aria-label="Retour">
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M15 5 8 12l7 7" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
          </button>

          <div class="live-page__meta">
            <span class="live-page__badge live-page__badge--live">
              <span class="dot" aria-hidden="true"></span>
              LIVE
            </span>
            <span class="live-page__badge live-page__badge--views">
              <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="M2.5 12s3.5-6.5 9.5-6.5S21.5 12 21.5 12s-3.5 6.5-9.5 6.5S2.5 12 2.5 12Z" stroke="currentColor" stroke-width="2" />
                <circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="2" />
              </svg>
              <span data-live-views>0</span>
            </span>
          </div>
        </div>

        <div class="live-page__player">
          <div class="live-page__stage" aria-hidden="true"></div>
        </div>

        <div class="live-page__bottom">
          <div class="live-page__info">
            <h1 class="live-page__artist">Live</h1>
            <p class="live-page__subtitle">Concert en direct</p>
          </div>

          <div class="live-page__chat" aria-label="Messages du live"></div>

          <div class="live-page__actions">
            <input class="live-page__input" type="text" placeholder="Écrire un message..." />
            <button type="button" class="live-page__react" aria-label="Réagir">
              <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                <path d="M12 21s-7.2-4.4-9.4-8.3C1.2 10.1 2.4 7 5.2 6.2c1.8-.5 3.5.2 4.5 1.5C10.7 6.4 12.4 5.7 14.2 6.2c2.8.8 4 3.9 2.6 6.5C19.2 16.6 12 21 12 21Z" />
              </svg>
            </button>
          </div>
        </div>
      </main>
    </div>

    <script type="module">
      import { initLivePage } from './live.js'
      initLivePage()
    </script>
  </body>
</html>
