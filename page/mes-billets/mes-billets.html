<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
    <title>Mes billets</title>
    <link rel="stylesheet" href="../../styles/theme.css" />
    <link rel="stylesheet" href="../../styles/mobile.css" />
    <link rel="stylesheet" href="../../componant/navbar/navbar.css" />
    <link rel="stylesheet" href="../../componant/post-billet/post-billet.css" />
    <link rel="stylesheet" href="./mes-billets.css" />
  </head>
  <body>
    <div class="app-shell" id="app">
      <main class="mes-billets">
        <a class="mes-billets__back" href="../profil/profil.html">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M15 5 8 12l7 7" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          Retour
        </a>
        <h1 class="mes-billets__title">Mes billets</h1>

        <div class="mes-billets__tabs" role="tablist" aria-label="Filtrer les billets">
          <button type="button" class="mes-billets__tab is-active" data-billets-tab="live">En live</button>
          <button type="button" class="mes-billets__tab" data-billets-tab="prevu">Prévu</button>
          <button type="button" class="mes-billets__tab" data-billets-tab="passe">Passé</button>
          <button type="button" class="mes-billets__tab" data-billets-tab="tout">Tout</button>
        </div>

        <div class="mes-billets__list" id="billets-list"></div>
      </main>
    </div>

    <script type="module">
      import { mountNavbar } from '../../componant/navbar/navbar.js'
      import { initMesBilletsFilters } from './mes-billets.js'
      import { posts } from '../../data/posts.js'

      mountNavbar('#app', { brand: 'My Concert', active: 'mes-billets' })
      initMesBilletsFilters(posts)
    </script>
  </body>
</html>
